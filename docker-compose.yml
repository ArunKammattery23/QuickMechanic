version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: quickmechanic_db
    environment:
      POSTGRES_DB: QuickMechanic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: quickmechanic-redis
    ports:
      - "6379:6379"

  redis_demo:
    image: redis:7-alpine
    container_name: quickmechanic-demo-redis
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  pgdata:
