version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: quickmechanic_db
    environment:
      POSTGRES_DB: QuickMechanic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
